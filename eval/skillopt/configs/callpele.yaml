_base_: /workspace/work/ref/SkillOpt/configs/_base_/default.yaml

model:
  backend: openai_compatible
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  optimizer: agnes-3.0-flash
  target: agnes-3.0-flash
  reasoning_effort: medium

train:
  num_epochs: 1
  batch_size: 6
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 6
  merge_batch_size: 6
  analyst_workers: 2
  failure_only: false

optimizer:
  learning_rate: 3
  min_learning_rate: 1
  slow_update_samples: 6

evaluation:
  use_gate: true
  eval_test: true

env:
  name: callpele
  skill_init: /workspace/work/call-pele-answer/eval/skillopt/skills/seed.md
  split_mode: split_dir
  split_dir: /workspace/work/call-pele-answer/eval/skillopt/data/split
  workers: 3
  max_completion_tokens: 6000
  limit: 0
